# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host. Infra's stacks/wedding-planner/host.conf
# grants what this file cannot (host paths, loopback ports, groups).
schema = 1

[deploy]
image = "wedding-planner"                  # the image built from this repository's Dockerfile
pin = "WEDDING_PLANNER_IMAGE"                      # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["wedding-planner"]           # all must be ready on the candidate
health = "/healthz"                  # probed through the tailnet name
ready_attempts = 20
rollback_services = ["wedding-planner"]

[check]
required_health_services = ["wedding-planner"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
paths = []                           # app data under state/, e.g. ["state/data"]

[env]
required = ["TS_AUTHKEY"]
generated = []
owner = []
