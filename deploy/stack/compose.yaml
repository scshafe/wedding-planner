# wedding-planner on the tailnet as its own machine, `wedding-planner`, served at
# https://wedding-planner.<tailnet>/ (tailnet only; never Funnel). An app-owned
# stack (scshafe infra docs/platform/agent-deploy.md): a merge to main deploys
# it through the runner lane; nobody runs `docker compose` on it by hand.
#
# The host's tools/stack validates this file against an allowlist before
# anything runs: no privileges, no host namespaces, binds only under ./state,
# images either built here (through the pin) or pinned by digest. `dev check`
# runs the same validator (DEPLOY-04).
#
# DEMO-SEEDED and fully offline-simulated (billing, payments, guest messaging:
# no outbound network at all). Deployed 2026-08-13 on the operator's explicit
# instruction: this tailnet-only, simulated-comms deployment is the operator's
# call, not an agent's own judgment.
#
# ZERO persistence by design: all state is in memory; every restart or deploy
# resets to the demo seed (tenant 'demo' at /t/demo). The container never
# writes its filesystem, which is why the hardening below is free. Login is a
# simulated role picker: anyone who reaches the node is a planner on the demo
# tenant; the tailnet is the access control (door none).
name: wedding-planner

services:
  ts-wedding-planner:
    # tailscale/tailscale:v1.102.2 (the tag this node ran before the move),
    # multi-arch index digest
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: ts-wedding-planner
    init: true
    restart: unless-stopped
    # Public resolvers: control plane, DERP and ACME only, no ts.net names
    # (STUDY-GUIDE case study #4).
    dns: [1.1.1.1, 1.0.0.1]
    security_opt: [no-new-privileges:true]
    environment:
      TS_HOSTNAME: wedding-planner
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  # The service keeps its pre-move name `app` so the first deploy replaces the
  # running container in place (same compose project, same container name).
  app:
    # Built by the host from this repository's Dockerfile at the merged commit
    # and pinned in the runtime .env by the deploy.
    image: ${WEDDING_PLANNER_IMAGE}
    container_name: wedding-planner
    init: true
    user: "1000:1000"  # the image's `node` user; the app binds no state
    restart: unless-stopped
    network_mode: service:ts-wedding-planner
    depends_on: [ts-wedding-planner]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      HOST: "127.0.0.1"  # serve shares this namespace; loopback is the door
      PORT: "8080"
      # Stable tokens (>=16 characters, enforced at boot, fail-closed) so the
      # operator/admin lane and the webhook lane survive restarts. The owner's
      # values, placed on the host with `stack env-set` ([env] owner).
      WP_OPERATOR_TOKEN: ${WP_OPERATOR_TOKEN:?set WP_OPERATOR_TOKEN in .env}
      WP_PROVIDER_WEBHOOK_TOKEN: ${WP_PROVIDER_WEBHOOK_TOKEN:?set WP_PROVIDER_WEBHOOK_TOKEN in .env}
      # WP_SEED_DEMO defaults to true: the demo tenant re-provisions each boot.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
